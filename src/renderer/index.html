<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aura Tone</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="frame-chrome">
      <div class="frame-drag-region">
        <span>Aura Tone</span>
        <span id="transport-state" class="transport-state">Idle</span>
      </div>
      <nav class="frame-controls" aria-label="Window controls">
        <button class="frame-button" type="button" id="pin-window" title="Toggle always on top" aria-label="Toggle always on top">Pin</button>
        <button class="frame-button" type="button" id="minimize-window" title="Minimize" aria-label="Minimize">_</button>
        <button class="frame-button danger" type="button" id="close-window" title="Close" aria-label="Close">X</button>
      </nav>
    </header>

    <main class="tone-shell" aria-label="Aura Tone sound panel">
      <section class="top-band" aria-label="Transport and runtime">
        <div>
          <p class="eyebrow">Phase instrument</p>
          <h1>Gear coherence panel</h1>
        </div>
        <div class="transport-panel">
          <button id="transport-toggle" class="command-button primary" type="button">Start</button>
          <button id="randomize-patch" class="command-button" type="button">Mutate</button>
          <button id="freeze-patch" class="command-button" type="button" aria-pressed="false">Freeze</button>
        </div>
        <dl class="status-grid" aria-label="Runtime status">
          <div>
            <dt>Runtime</dt>
            <dd id="health">Checking</dd>
          </div>
          <div>
            <dt>Services</dt>
            <dd id="commands">0</dd>
          </div>
        </dl>
      </section>

      <section class="control-strip" aria-label="Global controls">
        <label>
          <span>Tempo</span>
          <input id="tempo-control" type="range" min="60" max="180" step="1" value="108">
          <strong id="tempo-value">108 bpm</strong>
        </label>
        <label>
          <span>Field Mix</span>
          <input id="field-mix-control" type="range" min="0" max="100" step="1" value="42">
          <strong id="field-mix-value">42%</strong>
        </label>
        <label>
          <span>Gear Mix</span>
          <input id="gear-mix-control" type="range" min="0" max="100" step="1" value="72">
          <strong id="gear-mix-value">72%</strong>
        </label>
      </section>

      <section class="machine-grid">
        <div class="readout-panel gear-panel" aria-labelledby="gear-title">
          <div class="panel-head">
            <p class="eyebrow" id="gear-title">Gear Train</p>
            <span id="tick-readout">tick 0000</span>
          </div>
          <div id="gear-list" class="gear-list"></div>
        </div>

        <div class="readout-panel connector-panel" aria-labelledby="connector-title">
          <div class="panel-head">
            <p class="eyebrow" id="connector-title">Connectors</p>
            <span id="coherence-readout">coh 00%</span>
          </div>
          <div id="connector-list" class="connector-list"></div>
        </div>

        <div class="readout-panel field-panel" aria-labelledby="field-title">
          <div class="panel-head">
            <p class="eyebrow" id="field-title">Field Tone</p>
            <span id="field-mode">stepped</span>
          </div>
          <div class="field-modes" role="group" aria-label="Field tone mode">
            <button class="mode-button active" type="button" data-field-mode="stepped" aria-pressed="true">Stepped</button>
            <button class="mode-button" type="button" data-field-mode="glide" aria-pressed="false">Glide</button>
            <button class="mode-button" type="button" data-field-mode="constant" aria-pressed="false">Constant</button>
          </div>
          <div class="field-steps" aria-label="Field step offsets">
            <label class="field-step active" data-field-step-cell="0">
              <span>S1</span>
              <input id="field-step-0" type="range" min="-12" max="12" step="1" value="-5">
              <strong id="field-step-value-0">-5</strong>
            </label>
            <label class="field-step" data-field-step-cell="1">
              <span>S2</span>
              <input id="field-step-1" type="range" min="-12" max="12" step="1" value="0">
              <strong id="field-step-value-1">+0</strong>
            </label>
            <label class="field-step" data-field-step-cell="2">
              <span>S3</span>
              <input id="field-step-2" type="range" min="-12" max="12" step="1" value="4">
              <strong id="field-step-value-2">+4</strong>
            </label>
            <label class="field-step" data-field-step-cell="3">
              <span>S4</span>
              <input id="field-step-3" type="range" min="-12" max="12" step="1" value="7">
              <strong id="field-step-value-3">+7</strong>
            </label>
          </div>
          <div class="field-value">
            <span>frequency</span>
            <strong id="field-frequency">000 Hz</strong>
          </div>
          <div class="field-meter" aria-hidden="true"><span id="field-meter-fill"></span></div>
          <dl class="field-stats">
            <div>
              <dt>source</dt>
              <dd>connector coherence</dd>
            </div>
            <div>
              <dt>range</dt>
              <dd>90-620Hz</dd>
            </div>
          </dl>
        </div>
      </section>

      <section class="log-panel" aria-label="Event stream">
        <div class="panel-head">
          <p class="eyebrow">Event Stream</p>
          <span id="patch-state">patch mutable</span>
        </div>
        <ul id="event-log" class="event-log"></ul>
      </section>

      <section class="service-panel" aria-label="Registered services" hidden>
        <ul id="service-list" class="service-list"></ul>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
